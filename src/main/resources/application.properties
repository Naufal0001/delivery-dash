spring.application.name=delivery-dash

# Konfigurasi Koneksi MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/delivery_dash?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Kup4tahutang=

# Konfigurasi Spring Data JPA / Hibernate
# Menggunakan update agar JPA menyesuaikan tabel dengan struktur Entity (jika perlu)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Format Waktu (Selaras dengan UTC dari hardware)
spring.jackson.time-zone=UTC